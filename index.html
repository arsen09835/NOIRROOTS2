<!doctype html>
<html lang="en">
  <head>
    <base href="/" />
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      /* Prevent FOUC (Flash of Unstyled Content) */
      html, body {
        margin: 0;
        padding: 0;
        background-color: #FAF9F7;
        color: #222;
        font-family: 'Source Sans 3', sans-serif;
      }
      #root {
        min-height: 100vh;
        background-color: #FAF9F7;
      }
      /* Hide content until CSS is loaded */
      .loading {
        opacity: 0;
        transition: opacity 0.3s ease-in-out;
      }
      .loaded {
        opacity: 1;
      }
    </style>
    <title>Noir Roots Hair Oil Landing Page</title>
    <!-- Early scroll restoration script -->
    <script id="top-on-nav-early">
      (function () {
        try { history.scrollRestoration = 'manual'; } catch(_) {}
        var goTop = function(){ window.scrollTo(0, 0); };
        if (!location.hash || location.hash.toLowerCase() === '#top') {
          goTop(); setTimeout(goTop, 0); setTimeout(goTop, 120);
        }
      })();
    </script>
  </head>
  <body>
    <!-- Global top anchor -->
    <div id="top" style="position:absolute;top:0;left:0;width:1px;height:1px;"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Robust link normalizer and scroll management -->
    <script id="top-on-nav">
(function () {
  try { history.scrollRestoration = 'manual'; } catch(_) {}

  var ALLOW_HASH = new Set([
    '#home', '#ingredients', '#how-to', '#story', '#buy',
    '#reviews', '#faq', '#contact', '#top'
  ]);

  function isSamePath(u) {
    return u.pathname.replace(/\/+$/, '') === location.pathname.replace(/\/+$/, '');
  }

  function patchLinks(root) {
    (root || document).querySelectorAll('a, [data-href], button[data-href]').forEach(function (el) {
      var href = el.getAttribute('href') || el.getAttribute('data-href');
      if (!href) return;

      if (href[0] === '#') return;

      try {
        var url = new URL(href, location.origin);
        if (url.origin !== location.origin) return;

        if (isSamePath(url)) {
          if (!url.hash || !ALLOW_HASH.has(url.hash.toLowerCase())) return;
        } else {
          url.hash = '#top';
          var newHref = url.pathname + url.search + url.hash;
          if (el.tagName === 'A') el.setAttribute('href', newHref);
          else el.setAttribute('data-href', newHref);
        }
      } catch(e) {}
    });
  }

  var toTopSoon = function(){ requestAnimationFrame(function(){ window.scrollTo(0,0); }); };
  var _push = history.pushState, _replace = history.replaceState;
  history.pushState = function(){ _push.apply(this, arguments); toTopSoon(); };
  history.replaceState = function(){ _replace.apply(this, arguments); toTopSoon(); };
  window.addEventListener('popstate', toTopSoon);

  document.addEventListener('click', function (e) {
    var el = e.target && e.target.closest('a, [data-href], button[data-href]');
    if (!el) return;
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    if (el.getAttribute('target') === '_blank') return;

    patchLinks(document);
    setTimeout(function(){ window.scrollTo(0,0); }, 60);
  }, { capture: true });

  patchLinks(document);
  var mo = new MutationObserver(function(m){ patchLinks(document); });
  mo.observe(document.documentElement, { childList: true, subtree: true });

  try { document.documentElement.style.scrollBehavior = 'smooth'; } catch(_) {}
})();
    </script>
    <script>
(function () {
  const blocks = document.querySelectorAll('.story-hero, #my-story, [data-section="story"]');
  blocks.forEach((wrap) => {
    const imgWrap =
      wrap.querySelector('.story-hero-img') ||
      wrap.querySelector('figure, .image, .media, .hero-image');

    let caption =
      wrap.querySelector('.founder-caption') ||
      wrap.querySelector('[data-founder], .founder, .founder-meta, .author, .caption');

    if (!imgWrap) return;

    if (!caption) {
      const txtNode =
        wrap.querySelector('.founder, .founder-meta, .author, .caption, aside, [data-founder]');
      const name = txtNode?.querySelector('h3, h4, .name')?.textContent?.trim() || 'Joseph Castillo';
      const role = txtNode?.querySelector('p, small, .role')?.textContent?.trim() || 'Founder & Creator';
      caption = document.createElement('div');
      caption.className = 'founder-caption';
      caption.innerHTML = `<h3>${name}</h3><p>${role}</p>`;
    } else {
      caption.classList.add('founder-caption');
    }

    if (caption !== imgWrap.nextElementSibling) {
      imgWrap.insertAdjacentElement('afterend', caption);
    }
  });
})();
    </script>
  </body>
</html>
