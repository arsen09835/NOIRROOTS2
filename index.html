<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      /* Prevent FOUC (Flash of Unstyled Content) */
      html, body {
        margin: 0;
        padding: 0;
        background-color: #FAF9F7;
        color: #222;
        font-family: 'Source Sans 3', sans-serif;
      }
      #root {
        min-height: 100vh;
        background-color: #FAF9F7;
      }
      /* Hide content until CSS is loaded */
      .loading {
        opacity: 0;
        transition: opacity 0.3s ease-in-out;
      }
      .loaded {
        opacity: 1;
      }
    </style>
    <title>Noir Roots Hair Oil Landing Page</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
(function () {
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

  if (location.hash && location.hash.toLowerCase() === '#top') {
    window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
  }

  const ensureTop = (el) => {
    const txt = (el.textContent || '').trim().toLowerCase();
    const isPreOrder = txt.includes('pre-order') || el.dataset.scrollTop === 'true';
    if (!isPreOrder) return;
    let href = el.getAttribute('href') || '';
    if (href && !href.includes('#top')) {
      const parts = href.split('#')[0];
      const hash = '#top';
      el.setAttribute('href', parts + hash);
    }
    el.addEventListener('click', () => {
      setTimeout(() => window.scrollTo({ top: 0, left: 0, behavior: 'instant' }), 50);
    }, { passive: true });
  };

  document.querySelectorAll('a,button').forEach(ensureTop);

  const back = document.getElementById('backHome');
  if (!back) return;

  const onHome = location.pathname === '/' || location.pathname === '/index.html';
  if (onHome) {
    back.setAttribute('href', '#top');
    back.addEventListener('click', (e) => {
      e.preventDefault();
      window.scrollTo({ top: 0, left: 0, behavior: 'smooth' });
    });
  } else {
    back.setAttribute('href', '/#top');
    back.addEventListener('click', () => {
      setTimeout(() => window.scrollTo({ top: 0, left: 0, behavior: 'instant' }), 80);
    }, { passive: true });
  }

  const isShopText = (el) => /shop/i.test((el.textContent || '').trim());
  const navLinks = Array.from(document.querySelectorAll('a,button'));
  navLinks.forEach(el => {
    const href = el.getAttribute('href') || '';
    if (isShopText(el) || href === '/shop' || href === 'shop' || href === '#buy') {
      el.setAttribute('href', '/#buy');
    }
  });

  try { document.documentElement.style.scrollBehavior = 'smooth'; } catch(_) {}
})();
    </script>
    <script>
(function () {
  const SEL = [
    '[id*="tidio"]','[class*="tidio"]',
    '[id*="crisp"]','[class*="crisp"]',
    '[id*="intercom"]','[class*="intercom"]',
    '[id*="voiceglow"]','[class*="voiceglow"]',
    '[id*="VG_"]','[class*="vg-"]',
    '[src*="tawk.to"]','[src*="zndsk"]','[src*="gorgias"]',
    'iframe[src*="chat"]'
  ];
  const kill = () => {
    document.querySelectorAll(SEL.join(',')).forEach(n => n.remove());
  };
  kill();
  setTimeout(kill, 1500);
})();
    </script>
  </body>
</html>
