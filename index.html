<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      /* Prevent FOUC (Flash of Unstyled Content) */
      html, body {
        margin: 0;
        padding: 0;
        background-color: #FAF9F7;
        color: #222;
        font-family: 'Source Sans 3', sans-serif;
      }
      #root {
        min-height: 100vh;
        background-color: #FAF9F7;
      }
      /* Hide content until CSS is loaded */
      .loading {
        opacity: 0;
        transition: opacity 0.3s ease-in-out;
      }
      .loaded {
        opacity: 1;
      }
    </style>
    <title>Noir Roots Hair Oil Landing Page</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
(function () {
  const backBtn = document.getElementById('backHome');
  const buy = document.getElementById('buy');
  const home = document.getElementById('home');

  if (!backBtn || !buy || !home) return;

  document.documentElement.style.scrollBehavior = 'smooth';

  const io = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        backBtn.hidden = false;
      } else {
        backBtn.hidden = true;
      }
    });
  }, { threshold: 0.2 });
  io.observe(buy);

  backBtn.addEventListener('click', (e) => {
    e.preventDefault();
    if (window.history.length > 1 && document.referrer) {
      window.history.back();
      setTimeout(() => { location.hash = '#home'; }, 300);
    } else {
      location.hash = '#home';
    }
  });

  const shopLinks = Array.from(document.querySelectorAll('a,button'))
    .filter(el => /shop/i.test(el.textContent || '') || el.getAttribute('href') === '#buy');

  shopLinks.forEach(el => {
    el.setAttribute('href', '#buy');
    el.addEventListener('click', () => {
    }, { passive: true });
  });
})();
    </script>
    <script>
(function () {
  const SEL = [
    '[id*="tidio"]','[class*="tidio"]',
    '[id*="crisp"]','[class*="crisp"]',
    '[id*="intercom"]','[class*="intercom"]',
    '[id*="voiceglow"]','[class*="voiceglow"]',
    '[id*="VG_"]','[class*="vg-"]',
    '[src*="tawk.to"]','[src*="zndsk"]','[src*="gorgias"]',
    'iframe[src*="chat"]'
  ];
  const kill = () => {
    document.querySelectorAll(SEL.join(',')).forEach(n => n.remove());
  };
  kill();
  setTimeout(kill, 1500);
})();
    </script>
  </body>
</html>
